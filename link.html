
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spiele Server | Links</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #8b0000;
      color: white;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    header {
      padding: 40px 20px 25px;
      background: linear-gradient(#3d0000, #8b0000);
    }

    .logo {
      width: 160px;
      max-width: 65%;
      height: auto;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 15px #ff3333);
    }

    header h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 12px;
    }

    header p {
      color: #ffdada;
      line-height: 1.6;
    }

    /* NAVIGATIONSLEISTE */
    nav {
      background: #350000;
      padding: 18px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-top: 1px solid #a52a2a;
      border-bottom: 1px solid #a52a2a;
    }

    nav a {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin: 5px 14px;
      font-weight: bold;
      transition: color 0.2s;
    }

    nav a:hover,
    nav a.active {
      color: #ff7777;
    }

    /* HAUPTBEREICH */
    .links {
      width: 90%;
      max-width: 600px;
      margin: auto;
      padding: 55px 0;
    }

    .links h2 {
      font-size: 30px;
      margin-bottom: 14px;
    }

    .intro {
      color: #ffe5e5;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .link-button {
      display: block;
      padding: 20px;
      margin: 16px 0;
      background: #570000;
      border: 1px solid #ff5555;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.25s;
    }

    .link-button:hover {
      background: #c00000;
      transform: translateY(-4px);
      box-shadow: 0 5px 18px #40000066;
    }


    footer {
      margin-top: auto;
      background: #350000;
      padding: 25px 15px;
      color: #e6baba;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      nav {
        padding: 12px 5px;
      }

      nav a {
        margin: 7px 8px;
        font-size: 14px;
      }

      .links {
        padding: 40px 0;
      }
    }
  </style>
</head>

<body>

  <header id="start">
    <img src="logo.png" alt="Spiele Server logo" class="logo">

    <h1>Unsere Links</h1>

    <p>Hier findest du einige Links</p>
  </header>

  <nav>
    <a href="index.html">Start</a>
    <a href="link.html">Links</a>
  </nav>

  <main class="links">
    <h2>🔗 Unsere Link</h2>

    <p class="intro">
      
    </p>

    <a class="link-button"
       href="https://discord.gg/DEIN-CODE"
       target="_blank"
       rel="noopener noreferrer">
      🎮 Unser Discord
    </a>

    <a class="link-button"
       href="https://www.twitch.tv/spieleserver"
       target="_blank"
       rel="noopener noreferrer">
      🟣 Twitch
    </a>

    <a class="link-button"
       href="https://www.twitch.tv/KiaBruno"
       target="_blank"
       rel="noopener noreferrer">
      🟣 Twitch – KiaBruno
    </a>

    <a class="link-button"
       href="https://www.twitch.tv/joostlemkrt"
       target="_blank"
       rel="noopener noreferrer">
      🟣 Twitch – dabavylon

  </main>

  <footer>
    © 2026 Gaming Community | Gemeinsam spielen, gemeinsam Spaß haben.
  </footer>

</body>
</html>
