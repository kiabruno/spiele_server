
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spiele Server | Links</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #8b0000;
      color: white;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    header {
      padding: 40px 20px 25px;
      background: linear-gradient(#3d0000, #8b0000);
    }

    .logo {
      width: 160px;
      max-width: 65%;
      height: auto;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 15px #ff3333);
    }

    header h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 12px;
    }

    header p {
      color: #ffdada;
      line-height: 1.6;
    }

    .links {
      width: 90%;
      max-width: 600px;
      margin: auto;
      padding: 35px 0 55px;
    }

    .links h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .links .intro {
      color: #ffe5e5;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .link-button {
      display: block;
      padding: 20px;
      margin: 16px 0;
      background: #570000;
      border: 1px solid #ff5555;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.25s;
    }

    .link-button:hover {
      background: #c00000;
      transform: translateY(-4px);
      box-shadow: 0 5px 18px #40000066;
    }

    footer {
      margin-top: auto;
      background: #350000;
      padding: 25px 15px;
      color: #e6baba;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.png" alt="Spiele Server Logo" class="logo">

    <h1>Unsere Links</h1>

    <p>Alle wichtigen Links unserer Gaming Community auf einen Blick!</p>
  </header>

  <main class="links">
    <h2>🔗 Unsere Socials</h2>

    <p class="intro">
      Folge uns und werde Teil unserer Community!
    </p>

    <a class="link-button"
       href="https://discord.gg/DEIN-CODE"
       target="_blank"
       rel="noopener noreferrer">
      🎮 Unser Discord
    </a>

    <a class="link-button"
       href="https://www.twitch.tv/KIABRUNO"
       target="_blank"
       rel="noopener noreferrer">
      🟣 Twitch – KiaBruno
    </a>

    <a class="link-button"
       href="https://www.twitch.tv/DEIN-DAY-KANAL"
       target="_blank"
       rel="noopener noreferrer">
      🟣 Twitch – Day
    </a>
  </main>

  <footer>
    © 2026 Gaming Community | Gemeinsam spielen, gemeinsam Spaß haben.
  </footer>

</body>
</html>
