
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mein Gaming Server</title>

  <!-- Bild im Browser-Tab -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #b00000;
      background: linear-gradient(135deg, #600000, #d00000, #8b0000);
    }

    .logo {
      width: 280px;
      max-width: 75vw;
      height: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <!-- Logo genau in der Mitte -->
  <img src="logo.png" alt="Gaming Server Logo" class="logo">

</body>
</html>
